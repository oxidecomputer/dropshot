#
# Configuration for GitHub-based CI, based on the stock GitHub Rust config.
#
name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: Report cargo version
        run: cargo --version
      - name: Report rustfmt version
        run: cargo fmt -- --version
      - name: Check style
        run: cargo fmt -- --check

  clippy-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: Report cargo version
        run: cargo --version
      - name: Report Clippy version
        run: cargo clippy -- --version
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false # See Swatinem/rust-cache#341.
      - name: Run Clippy Lints
        run: cargo clippy --all-targets -- --deny warnings

  check-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: Report cargo version
        run: cargo --version
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false # See Swatinem/rust-cache#341.
      - name: Check Docs
        run: cargo doc --no-deps --lib --bins --examples

  build-and-test:
    runs-on: ${{ matrix.os }}
    env:
      # rust-toolchain.toml overrides the dtolnay/rust-toolchain selection --
      # set this environment variable, which overrides rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      matrix:
        # macos-14 for M1 runners
        os: [ubuntu-22.04, windows-2022, macos-14]
        features: [all, default]
        rust-version: [stable, msrv]
        include:
          - features: all
            feature_flags: --all-features
          - rust-version: stable
            toolchain: stable
          - rust-version: msrv
            # Keep this in sync with rust-version in Cargo.toml.
            toolchain: "1.88"
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Report cargo version
        run: cargo --version
      - name: Report rustc version
        run: rustc --version
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Matrix instances other than OS need to be added to this explicitly
          key: ${{ matrix.features }}
          cache-bin: false # See Swatinem/rust-cache#341.
      - name: Build
        run: cargo build ${{ matrix.feature_flags }} --locked --all-targets --verbose
      - name: Run tests
        # The trybuild fixtures run in the trybuild job below, since they require the pinned toolchain.
        run: cargo test ${{ matrix.feature_flags }} --locked --all-targets --verbose -- --exact --skip fail

  trybuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      # rust-toolchain.toml overrides dtolnay/rust-toolchain@stable, so in some
      # sense using it is pointless. But it does a few other useful things such
      # as disable incremental compilation, so we use it anyway.
      - uses: dtolnay/rust-toolchain@stable
      - name: Report cargo version
        run: cargo --version
      - name: Report rustc version
        run: rustc --version
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false # See Swatinem/rust-cache#341.
      - name: Run trybuild tests
        run: cargo test --locked --verbose -p dropshot --test fail
