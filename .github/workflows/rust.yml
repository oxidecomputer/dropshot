#
# Configuration for GitHub-based CI, based on the stock GitHub Rust config.
#
name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report cargo version
        run: cargo --version
      - name: Report rustfmt version
        run: cargo fmt -- --version
      - name: Check style
        run: cargo fmt -- --check

  clippy-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report cargo version
        run: cargo --version
      - name: Report Clippy version
        run: cargo clippy -- --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false # See Swatinem/rust-cache#341.
      - name: Run Clippy Lints
        run: cargo clippy --all-targets -- --deny warnings

  check-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report cargo version
        run: cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false # See Swatinem/rust-cache#341.
      - name: Check Docs
        run: cargo doc --no-deps --lib --bins --examples

  build-and-test:
    runs-on: ${{ matrix.os }}
    env:
      # Override rust-toolchain.toml, which otherwise takes precedence over the
      # toolchain installed below.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      matrix:
        # macos-14 for M1 runners
        os: [ubuntu-22.04, windows-2022, macos-14]
        features: [all, default]
        rust-version: [stable, msrv]
        include:
          - features: all
            feature_flags: --all-features
          - rust-version: stable
            toolchain: stable
          - rust-version: msrv
            # Keep this in sync with rust-version in Cargo.toml.
            toolchain: "1.88"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update
      - name: Report cargo version
        run: cargo --version
      - name: Report rustc version
        run: rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Matrix instances other than OS need to be added to this explicitly
          key: ${{ matrix.features }}
          cache-bin: false # See Swatinem/rust-cache#341.
      - name: Build
        run: cargo build ${{ matrix.feature_flags }} --locked --all-targets --verbose
      - name: Run tests
        # The trybuild fixtures run in the trybuild job below, since they require the pinned toolchain.
        run: cargo test ${{ matrix.feature_flags }} --locked --all-targets --verbose -- --exact --skip fail

  trybuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately no RUSTUP_TOOLCHAIN here: the toolchain is pinned by
      # rust-toolchain.toml, since the trybuild fixtures assert exact rustc
      # diagnostics against committed .stderr files. `rustup toolchain install`
      # with no argument installs the toolchain named by that file; `rustup
      # show` no longer installs it implicitly as of rustup 1.28.
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Report cargo version
        run: cargo --version
      - name: Report rustc version
        run: rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false # See Swatinem/rust-cache#341.
      - name: Run trybuild tests
        run: cargo test --locked --verbose -p dropshot --test fail
